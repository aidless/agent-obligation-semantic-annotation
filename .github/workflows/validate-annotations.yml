name: Validate annotation pack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Run on every pull request and every push to main. A path filter used to
      # skip the job unless a submission file changed, so a packet edit, a
      # template edit, or an answer-axis leak in prose could merge without this
      # gate. The blind-integrity check must see the whole tree.
      - name: Blind integrity check
        run: python3 scripts/check_blind_integrity.py

      - name: SHA256SUMS is current
        run: python3 scripts/gen_sha256sums.py --check

      - name: Packet and template inventory drift
        run: python3 scripts/check_inventory_drift.py

      # Submissions are gitignored and are not part of this release. The steps
      # below run only when a pull request actually adds one.
      - name: Validate annotator A
        if: ${{ hashFiles('annotations-a.jsonl') != '' }}
        run: python3 scripts/validate_submission.py annotations-a.jsonl --role A

      - name: Validate annotator B
        if: ${{ hashFiles('annotations-b.jsonl') != '' }}
        run: python3 scripts/validate_submission.py annotations-b.jsonl --role B

      - name: Validate adjudication
        if: ${{ hashFiles('adjudication.jsonl') != '' }}
        run: python3 scripts/validate_submission.py adjudication.jsonl --role adjudicator
